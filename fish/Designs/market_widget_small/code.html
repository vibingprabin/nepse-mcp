<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEPSE Fisher Widget - Small</title>
<!-- Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#0e6c8b",
                        "background-light": "#f8f7f7",
                        "background-dark": "#0f1924",
                        "card-white": "#FAFAFA",
                        "deep-water": "#0D1C29",
                        "alert-red": "#CC3333",
                        "success-green": "#0e6c8b", // Using primary as ocean blue/success for this theme
                    },
                    fontFamily: {
                        "display": ["Space Grotesk", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "2xl": "1.7rem", "full": "9999px"},
                    boxShadow: {
                        "soft": "0 4px 20px -2px rgba(13, 28, 41, 0.08)",
                    }
                },
            },
        }
    </script>
<style>
        /* iOS Widget Simulation Wrapper */
        .ios-widget-wrapper {
            width: 160px; /* Approximate small widget width */
            height: 160px; /* Approximate small widget height */
        }
        
        /* Font Features for Tabular Numbers */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark min-h-screen flex items-center justify-center font-display p-8 transition-colors duration-300">
<!-- Preview Container showing widget context (phone screen simulation area) -->
<div class="relative w-full max-w-sm mx-auto flex flex-col items-center gap-12">
<!-- Widget Variant 1: Market Open (Positive) -->
<div class="flex flex-col items-center gap-4">
<span class="text-xs font-medium text-gray-400 uppercase tracking-widest">Variant 1: Market Open</span>
<!-- Widget Component Starts Here -->
<div class="ios-widget-wrapper relative bg-card-white dark:bg-gray-800 rounded-3xl shadow-soft dark:shadow-none dark:border dark:border-white/10 overflow-hidden flex flex-col p-4 justify-between transition-colors duration-300 group cursor-default hover:scale-105 transition-transform duration-300 ease-out">
<!-- Header -->
<div class="flex items-start justify-between w-full">
<span class="text-deep-water dark:text-white font-bold text-xs tracking-wide">NEPSE</span>
<div class="flex items-center gap-1 bg-primary/10 px-1.5 py-0.5 rounded-md">
<span class="relative flex h-1.5 w-1.5">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-1.5 w-1.5 bg-primary"></span>
</span>
<span class="text-[9px] font-bold text-primary tracking-wider">OPEN</span>
</div>
</div>
<!-- Center: Primary Metric -->
<div class="flex flex-col items-start gap-0.5">
<span class="text-3xl font-bold text-deep-water dark:text-white tabular-nums tracking-tighter leading-none">2,045</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-deep-water dark:text-gray-300 tabular-nums leading-none">.32</span>
<div class="flex items-center gap-0.5 text-primary bg-primary/5 rounded px-1 py-0.5">
<span class="material-symbols-outlined text-[10px] font-bold" style="font-size: 10px;">arrow_outward</span>
<span class="text-[10px] font-bold tabular-nums">1.2%</span>
</div>
</div>
</div>
<!-- Footer: Secondary Metric -->
<div class="w-full pt-2 border-t border-gray-100 dark:border-white/5">
<div class="flex flex-col">
<div class="flex justify-between items-baseline w-full">
<span class="text-[10px] font-medium text-gray-500 dark:text-gray-400 uppercase">Latest</span>
</div>
<p class="text-[11px] leading-tight text-deep-water dark:text-gray-200 truncate w-full font-medium mt-0.5">
<span class="font-bold">NABIL</span> <span class="tabular-nums">490.8</span> <span class="text-primary tabular-nums ml-0.5 text-[10px]">(+3.2%)</span>
</p>
</div>
</div>
<!-- Subtle Decorative Gradient Mesh for Depth (barely visible) -->
<div class="absolute -top-10 -right-10 w-24 h-24 bg-gradient-to-br from-primary/5 to-transparent rounded-full blur-2xl pointer-events-none"></div>
</div>
<!-- Widget Component Ends Here -->
</div>
<!-- Widget Variant 2: Market Closed (Negative/Red usage example) -->
<div class="flex flex-col items-center gap-4">
<span class="text-xs font-medium text-gray-400 uppercase tracking-widest">Variant 2: Market Closed (Red)</span>
<!-- Widget Component Starts Here -->
<div class="ios-widget-wrapper relative bg-card-white dark:bg-gray-800 rounded-3xl shadow-soft dark:shadow-none dark:border dark:border-white/10 overflow-hidden flex flex-col p-4 justify-between transition-colors duration-300 group cursor-default hover:scale-105 transition-transform duration-300 ease-out">
<!-- Header -->
<div class="flex items-start justify-between w-full">
<span class="text-deep-water dark:text-white font-bold text-xs tracking-wide">NEPSE</span>
<div class="flex items-center gap-1 bg-gray-100 dark:bg-white/5 px-1.5 py-0.5 rounded-md">
<span class="material-symbols-outlined text-gray-400 text-[10px]" style="font-size: 10px;">lock</span>
<span class="text-[9px] font-bold text-gray-400 tracking-wider">CLOSED</span>
</div>
</div>
<!-- Center: Primary Metric -->
<div class="flex flex-col items-start gap-0.5">
<span class="text-3xl font-bold text-deep-water dark:text-white tabular-nums tracking-tighter leading-none">2,012</span>
<div class="flex items-baseline gap-1">
<span class="text-lg font-bold text-deep-water dark:text-gray-300 tabular-nums leading-none">.45</span>
<div class="flex items-center gap-0.5 text-alert-red bg-alert-red/5 rounded px-1 py-0.5">
<span class="material-symbols-outlined text-[10px] font-bold" style="font-size: 10px;">trending_down</span>
<span class="text-[10px] font-bold tabular-nums">-0.8%</span>
</div>
</div>
</div>
<!-- Footer: Secondary Metric -->
<div class="w-full pt-2 border-t border-gray-100 dark:border-white/5">
<div class="flex flex-col">
<div class="flex justify-between items-baseline w-full">
<span class="text-[10px] font-medium text-gray-500 dark:text-gray-400 uppercase">Focus</span>
</div>
<p class="text-[11px] leading-tight text-deep-water dark:text-gray-200 truncate w-full font-medium mt-0.5">
<span class="font-bold">NICA</span> <span class="tabular-nums">720.0</span> <span class="text-alert-red tabular-nums ml-0.5 text-[10px]">(-1.5%)</span>
</p>
</div>
</div>
</div>
<!-- Widget Component Ends Here -->
</div>
</div>
</body></html>
