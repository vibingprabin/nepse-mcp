<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>NEPSE Fisher Widget</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              colors: {
                "primary": "#16649c", // Ocean Blue
                "background-light": "#ffffff",
                "background-dark": "#1f262e",
              },
              fontFamily: {
                "display": ["Inter", "sans-serif"]
              },
              borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
            },
          },
        }
      </script>
<style>
          /* Smooth font rendering for a premium feel */
          body {
              -webkit-font-smoothing: antialiased;
              -moz-osx-font-smoothing: grayscale;
          }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-[#f2f4f6] dark:bg-[#111519] flex items-center justify-center min-h-screen p-4 font-display">
<!-- Widget Container: Simulating a Large iOS Widget (approx aspect ratio) -->
<!-- Using a slightly constrained width to mimic phone screen widget context -->
<div class="relative w-full max-w-[340px] aspect-square bg-background-light dark:bg-background-dark rounded-[24px] shadow-[0_8px_30px_rgb(0,0,0,0.04)] dark:shadow-none flex flex-col overflow-hidden border border-white/50 dark:border-white/5 p-5 group/widget">
<!-- TOP SECTION: Market Status (Modified Stats Component) -->
<div class="flex flex-col gap-1 pb-4">
<div class="flex items-center justify-between">
<div class="flex items-center gap-1.5 opacity-60">
<span class="material-symbols-outlined text-[18px] text-gray-900 dark:text-white" data-weight="300">show_chart</span>
<span class="text-[11px] font-bold tracking-[0.1em] uppercase text-gray-900 dark:text-white">NEPSE Index</span>
</div>
<!-- Live Pulse Dot -->
<div class="flex h-2 w-2 relative">
<span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-primary opacity-75"></span>
<span class="relative inline-flex rounded-full h-2 w-2 bg-primary"></span>
</div>
</div>
<div class="flex items-baseline gap-3 mt-1">
<h2 class="text-[32px] font-extrabold text-gray-900 dark:text-white leading-none tracking-tight">2,045.12</h2>
<div class="flex flex-col items-start leading-none">
<span class="text-sm font-bold text-primary">+0.61%</span>
<span class="text-[10px] font-medium text-gray-400 dark:text-gray-500 mt-0.5">+12.45 pts</span>
</div>
</div>
</div>
<!-- SEPARATOR -->
<div class="h-px w-full bg-gradient-to-r from-gray-100 via-gray-200 to-gray-100 dark:from-white/5 dark:via-white/10 dark:to-white/5"></div>
<!-- MIDDLE SECTION: Timeline (Modified Timeline Component) -->
<!-- Bento-style compact list -->
<div class="flex-1 py-4 flex flex-col justify-center gap-0 relative">
<!-- Connecting Line -->
<div class="absolute left-[19px] top-6 bottom-6 w-[1.5px] bg-gray-100 dark:bg-gray-700/50 z-0"></div>
<!-- Event 1 (Most Recent) -->
<div class="relative flex items-center gap-3 py-2 z-10">
<div class="flex items-center justify-center w-10 h-6 bg-background-light dark:bg-background-dark">
<div class="h-2.5 w-2.5 rounded-full border-[2.5px] border-primary bg-white dark:bg-background-dark shadow-[0_0_0_2px_rgba(22,100,156,0.1)]"></div>
</div>
<div class="flex flex-col min-w-0">
<p class="text-[13px] font-semibold text-gray-900 dark:text-gray-100 truncate">NICA signal changed to BUY</p>
<p class="text-[11px] text-gray-400 dark:text-gray-500 font-medium">11:00 AM • Signal Alert</p>
</div>
</div>
<!-- Event 2 -->
<div class="relative flex items-center gap-3 py-2 z-10 opacity-70">
<div class="flex items-center justify-center w-10 h-6 bg-background-light dark:bg-background-dark">
<div class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
</div>
<div class="flex flex-col min-w-0">
<p class="text-[13px] font-medium text-gray-800 dark:text-gray-300 truncate">NABIL announced 15% Bonus</p>
<p class="text-[11px] text-gray-400 dark:text-gray-500 font-medium">12:30 PM • Corporate</p>
</div>
</div>
<!-- Event 3 -->
<div class="relative flex items-center gap-3 py-2 z-10 opacity-50">
<div class="flex items-center justify-center w-10 h-6 bg-background-light dark:bg-background-dark">
<div class="h-1.5 w-1.5 rounded-full bg-gray-300 dark:bg-gray-600"></div>
</div>
<div class="flex flex-col min-w-0">
<p class="text-[13px] font-medium text-gray-800 dark:text-gray-300 truncate">Market volume spike detected</p>
<p class="text-[11px] text-gray-400 dark:text-gray-500 font-medium">2:00 PM • Analytics</p>
</div>
</div>
</div>
<!-- BOTTOM SECTION: Portfolio (Modified ProfileStats Component) -->
<div class="bg-gray-50 dark:bg-white/5 rounded-xl p-3 flex items-center justify-between border border-gray-100 dark:border-white/5">
<div class="flex flex-col gap-0.5">
<span class="text-[10px] uppercase tracking-wider font-bold text-gray-400 dark:text-gray-500">Portfolio Value</span>
<span class="text-lg font-bold text-gray-900 dark:text-white tabular-nums tracking-tight">Rs. 2,45,680</span>
</div>
<div class="flex items-center gap-1.5 bg-primary/10 dark:bg-primary/20 pl-2 pr-3 py-1.5 rounded-lg border border-primary/10">
<span class="material-symbols-outlined text-[16px] text-primary">trending_up</span>
<span class="text-sm font-bold text-primary tabular-nums">+1.4%</span>
</div>
</div>
</div>
</body></html>
