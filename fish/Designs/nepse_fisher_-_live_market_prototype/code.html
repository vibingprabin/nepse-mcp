<!DOCTYPE html>

<head>

    <!-- Theme Configuration -->

                        "primary": "#1d73c9",

                        "ocean-dark": "#2A3844",
                        "ocean-light": "#647587",
                        "background-light": "#F4F8F9",
                        "background-dark": "#101418",
                        "surface-light": "#FFFFFF",
                        "positive": "#1d73c9",
                        "negative": "#e11d48",
                        
                        // Merged from Screen 2
                        "card-dark": "#24272D",
                        "card-light": "#ffffff",
                        "text-secondary-dark": "#C6CAD1",
                        "text-secondary-light": "#64748b",
                        "financial-green": "#28A745",
                        "financial-red": "#DC3545",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"],
                        "grotesk": ["Space Grotesk", "sans-serif"],
                        "mono": ["JetBrains Mono", "monospace"],
                    },
                    boxShadow: {

    <style>
        body {
            min-height: max(884px, 100dvh);
            -webkit-tap-highlight-color: transparent;

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {

        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;

            background-image: linear-gradient(to right, #00000005 1px, transparent 1px),
                              linear-gradient(to bottom, #00000005 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .dark .bg-grid-pattern {
             background-image: linear-gradient(to right, #ffffff05 1px, transparent 1px),
                              linear-gradient(to bottom, #ffffff05 1px, transparent 1px);
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark text-ocean-dark dark:text-gray-100 font-display selection:bg-primary/20">
    <div id="root"></div>

    <!-- React Dependencies -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/history@5/umd/history.development.js"></script>
    <script src="https://unpkg.com/react-router@6.3.0/umd/react-router.development.js"></script>
    <script src="https://unpkg.com/react-router-dom@6.3.0/umd/react-router-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;
        const { createRoot } = ReactDOM;
        const { MemoryRouter, Routes, Route, Link, useNavigate } = ReactRouterDOM;

        // --- Data Mocking ---
        const timelineData = [
            {
                id: 1,
                time: "02:35",
                ampm: "PM",
                symbol: "NABIL",
                price: "490.80",
                change: "+2.4%",
                trend: "up",
                tag: "Price Breakout",
                tagColor: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300",
                volTag: "High Vol",
                active: true,
                link: null
            },
            {
                id: 2,
                time: "02:15",
                ampm: "PM",
                symbol: "NICA",
                price: "720.00",
                change: "+0.8%",
                trend: "up",
                tag: "Volume Expansion",
                tagColor: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300",
                volTag: null,
                active: false,
                link: "/signal" // This item links to detail page
            },
            {
                id: 3,
                time: "01:40",
                ampm: "PM",
                symbol: "HDHPC",
                price: "145.00",
                change: "-1.1%",
                trend: "down",
                tag: "Support Test",
                tagColor: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300",
                volTag: null,
                active: false,
                link: null
            },
            {
                id: 4,
                time: "12:30",
                ampm: "PM",
                symbol: "SHIVM",
                price: "512.00",
                change: "0.0%",
                trend: "neutral",
                tag: "Range Bound",
                tagColor: "bg-slate-50 text-slate-500 dark:bg-slate-800 dark:text-slate-400",
                volTag: null,
                active: false,
                opacity: "opacity-75",
                link: null
            }
        ];

        // --- Components ---

        // 1. Timeline Page Components
        const TimelineHeader = () => (
            <header class="sticky top-0 z-20 flex items-center justify-between px-5 py-4 bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-md border-b border-slate-200/50 dark:border-slate-800">
                <div class="flex flex-col">
                    <h1 class="text-xl font-extrabold tracking-tight text-ocean-dark dark:text-white">NEPSE Fisher</h1>
                    <span class="text-[10px] font-medium text-ocean-light uppercase tracking-widest mt-0.5">Live Feed</span>
                </div>
                <div class="flex items-center gap-2 bg-emerald-50 dark:bg-emerald-900/20 border border-emerald-100 dark:border-emerald-800/30 px-3 py-1.5 rounded-full shadow-sm">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-xs font-bold text-emerald-700 dark:text-emerald-400 tracking-wide">OPEN</span>
                </div>
            </header>
        );

        const TimelineCard = ({ data }) => {
            const isUp = data.trend === 'up';
            const isDown = data.trend === 'down';
            
            const TrendIcon = () => {
                if (isUp) return <span class="material-symbols-outlined text-[14px] text-primary" style={{fontVariationSettings: "'FILL' 1"}}>trending_up</span>;
                if (isDown) return <span class="material-symbols-outlined text-[14px] text-rose-500" style={{fontVariationSettings: "'FILL' 1"}}>trending_down</span>;
                return null;
            };

            const ChangeBadge = () => {
                let bgClass = "bg-slate-100 text-slate-500";
                if (isUp) bgClass = "bg-primary/10 dark:bg-primary/20 text-primary";
                if (isDown) bgClass = "bg-rose-50 dark:bg-rose-900/20 text-rose-500";

                return (
                    <div class={`flex items-center gap-1 px-2 py-1 rounded ${bgClass}`}>
                        <TrendIcon />
                        <span class={`font-mono text-xs font-bold ${isUp ? 'text-primary' : (isDown ? 'text-rose-500' : 'text-slate-500')}`}>{data.change}</span>
                    </div>
                );
            };

            const CardContent = (
                <div class={`bg-surface-light dark:bg-[#1a2026] rounded-xl p-4 shadow-card border border-slate-100 dark:border-slate-800 hover:shadow-soft transition-shadow duration-300 h-full`}>
                    <div class="flex justify-between items-start mb-3">
                        <div class="flex flex-col">
                            <h3 class="font-mono font-bold text-lg text-ocean-dark dark:text-white leading-none mb-1">{data.symbol}</h3>
                            <span class="font-mono text-sm text-ocean-light dark:text-slate-400">Rs. {data.price}</span>
                        </div>
                        <ChangeBadge />
                    </div>
                    <div class="flex justify-between items-center pt-2 border-t border-slate-50 dark:border-slate-800">
                        <span class={`inline-flex items-center px-2.5 py-1 rounded-md text-xs font-semibold ${data.tagColor}`}>
                            {data.tag}
                        </span>
                        {data.volTag && <span class="text-[10px] text-slate-400">{data.volTag}</span>}
                    </div>
                </div>
            );

            if (data.link) {
                return <Link to={data.link} class="block h-full">{CardContent}</Link>;
            }
            return CardContent;
        };

        const TimelineItem = ({ data }) => {
            return (
                <div class="group relative flex gap-4 pb-8 last:pb-0">
                    {/* Timeline Line */}
                    <div class="absolute left-[63px] top-8 bottom-0 w-px bg-slate-200 dark:bg-slate-800 group-last:hidden"></div>
                    
                    {/* Time Column */}
                    <div class="w-[45px] flex flex-col items-end pt-1 shrink-0">
                        <span class="text-xs font-semibold text-ocean-light">{data.time}</span>
                        <span class="text-[10px] text-slate-400 font-medium">{data.ampm}</span>
                    </div>
                    
                    {/* Timeline Node */}
                    <div class="relative flex flex-col items-center pt-2 shrink-0">
                        {data.active ? (
                            <div class="h-2.5 w-2.5 rounded-full border-2 border-primary bg-white dark:bg-background-dark z-10 shadow-[0_0_0_4px_rgba(244,248,249,1)] dark:shadow-[0_0_0_4px_rgba(16,20,24,1)]"></div>
                        ) : (
                            <div class="h-2.5 w-2.5 rounded-full border-2 border-slate-300 dark:border-slate-600 bg-white dark:bg-background-dark z-10 shadow-[0_0_0_4px_rgba(244,248,249,1)] dark:shadow-[0_0_0_4px_rgba(16,20,24,1)]"></div>
                        )}
                    </div>
                    
                    {/* Card Column */}
                    <div class={`flex-1 min-w-0 ${data.opacity || ''}`}>
                        <TimelineCard data={data} />
                    </div>
                </div>
            );
        };

        const BottomNav = () => (
            <nav class="fixed bottom-0 z-30 w-full max-w-md bg-surface-light/95 dark:bg-[#1a2026]/95 backdrop-blur border-t border-slate-200 dark:border-slate-800 px-6 pb-6 pt-3 left-1/2 -translate-x-1/2">
                <div class="flex justify-between items-center">
                    <a class="flex flex-col items-center gap-1 text-primary group cursor-pointer" onClick={(e) => e.preventDefault()}>
                        <span class="material-symbols-outlined text-[26px] transition-transform group-hover:-translate-y-0.5" style={{fontVariationSettings: "'FILL' 1, 'wght' 400"}}>water_drop</span>
                        <span class="text-[10px] font-bold">Stream</span>
                    </a>
                    <a class="flex flex-col items-center gap-1 text-slate-400 hover:text-ocean-dark dark:hover:text-white transition-colors group cursor-pointer">
                        <span class="material-symbols-outlined text-[26px] transition-transform group-hover:-translate-y-0.5" style={{fontVariationSettings: "'FILL' 0, 'wght' 300"}}>pie_chart</span>
                        <span class="text-[10px] font-medium">Portfolio</span>
                    </a>
                    <a class="flex flex-col items-center gap-1 text-slate-400 hover:text-ocean-dark dark:hover:text-white transition-colors group cursor-pointer">
                        <span class="material-symbols-outlined text-[26px] transition-transform group-hover:-translate-y-0.5" style={{fontVariationSettings: "'FILL' 0, 'wght' 300"}}>visibility</span>
                        <span class="text-[10px] font-medium">Watch</span>
                    </a>
                    <a class="flex flex-col items-center gap-1 text-slate-400 hover:text-ocean-dark dark:hover:text-white transition-colors group cursor-pointer">
                        <span class="material-symbols-outlined text-[26px] transition-transform group-hover:-translate-y-0.5" style={{fontVariationSettings: "'FILL' 0, 'wght' 300"}}>tune</span>
                        <span class="text-[10px] font-medium">Settings</span>
                    </a>
                </div>
            </nav>
        );

        const HomePage = () => {
            return (
                <div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl">
                    <TimelineHeader />
                    <main class="flex-1 px-5 pb-24 pt-6">
                        {timelineData.map(item => <TimelineItem key={item.id} data={item} />)}
                        
                        {/* End Indicator */}
                        <div class="flex justify-center mt-4">
                            <div class="flex flex-col items-center gap-2">
                                <div class="w-1 h-1 bg-slate-300 rounded-full"></div>
                                <div class="w-1 h-1 bg-slate-300 rounded-full"></div>
                                <div class="w-1 h-1 bg-slate-300 rounded-full"></div>
                                <span class="text-[10px] text-slate-400 font-medium uppercase tracking-widest mt-1">End of Live Feed</span>
                            </div>
                        </div>
                    </main>
                    <BottomNav />
                </div>
            );
        };

        // 2. Signal Details Page Components
        const SignalHeader = () => {
            const navigate = useNavigate();
            return (
                <header class="flex items-center justify-between p-4 border-b border-slate-200 dark:border-slate-800 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md sticky top-0 z-50">
                    <button onClick={() => navigate(-1)} class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-slate-900 dark:text-white">arrow_back_ios_new</span>
                    </button>
                    <h1 class="text-sm font-medium tracking-wide text-slate-500 dark:text-text-secondary-dark uppercase">Signal #8920</h1>
                    <button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-slate-900 dark:text-white">ios_share</span>
                    </button>
                </header>
            );
        };

        const SignalFooter = () => (
            <div class="absolute bottom-0 w-full bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-xl border-t border-slate-200 dark:border-slate-800 p-5 z-50">
                <div class="max-w-md mx-auto w-full flex gap-4">
                    <button onClick={() => alert("Added to watchlist!")} class="flex-1 h-14 rounded-lg border border-primary text-primary dark:text-primary font-bold text-base hover:bg-primary/5 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">bookmark_add</span>
                        Watchlist
                    </button>
                    <button onClick={() => alert("Added to portfolio!")} class="flex-[1.5] h-14 rounded-lg bg-primary text-white font-bold text-base shadow-lg shadow-primary/20 hover:shadow-primary/40 active:scale-[0.98] transition-all flex items-center justify-center gap-2">
                        <span class="material-symbols-outlined text-[20px]">add_circle</span>
                        Add to Portfolio
                    </button>
                </div>
                <div class="h-4 w-full"></div>
            </div>
        );

        const SignalPage = () => {
            return (
                <div class="relative flex h-full min-h-screen w-full flex-col max-w-md mx-auto bg-background-light dark:bg-background-dark overflow-hidden shadow-2xl font-grotesk">
                    <SignalHeader />
                    
                    <main class="flex-1 overflow-y-auto w-full relative">
                        {/* Background Grid Pattern */}
                        <div class="absolute inset-0 bg-grid-pattern pointer-events-none z-0 h-full"></div>
                        
                        <div class="p-5 pb-32 relative z-10 flex flex-col gap-6 max-w-md mx-auto w-full">
                            {/* Ticker Header Block */}
                            <div class="bg-card-light dark:bg-card-dark rounded-xl p-6 shadow-sm border border-slate-100 dark:border-slate-800 flex justify-between items-start">
                                <div class="flex flex-col gap-1">
                                    <div class="flex items-center gap-3 mb-1">
                                        <div class="w-12 h-12 rounded-lg bg-slate-100 dark:bg-slate-800 flex items-center justify-center overflow-hidden border border-slate-200 dark:border-slate-700">
                                            <span class="font-display font-bold text-lg tracking-tighter text-ocean-dark dark:text-white">N</span>
                                        </div>
                                        <div>
                                            <h2 class="text-3xl font-bold tracking-tight text-slate-900 dark:text-white leading-none">NICA</h2>
                                            <p class="text-sm text-slate-500 dark:text-text-secondary-dark truncate max-w-[180px]">NIC Asia Bank Ltd.</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex flex-col items-end">
                                    <span class="inline-flex items-center gap-1 px-3 py-1 rounded-full bg-financial-green/10 text-financial-green text-xs font-bold uppercase tracking-wider border border-financial-green/20">
                                        <span class="w-1.5 h-1.5 rounded-full bg-financial-green animate-pulse"></span>
                                        Buy Signal
                                    </span>
                                </div>
                            </div>

                            {/* Signal Narrative Card */}
                            <div class="bg-card-light dark:bg-card-dark rounded-xl p-6 shadow-sm border border-slate-100 dark:border-slate-800">
                                <div class="flex items-center gap-2 mb-4 text-slate-400 dark:text-slate-500">
                                    <span class="material-symbols-outlined text-[20px]">analytics</span>
                                    <h3 class="text-xs font-bold uppercase tracking-widest">Market Activity Analysis</h3>
                                </div>
                                <p class="text-lg md:text-xl font-medium leading-relaxed text-slate-800 dark:text-slate-200">
                                    Significant accumulation observed near the 52-week support zone. Institutional volume detected exceeding daily average by 40%.
                                </p>
                                <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-700/50 flex gap-2">
                                    <span class="inline-flex items-center px-2 py-1 rounded text-[10px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">#accumulation</span>
                                    <span class="inline-flex items-center px-2 py-1 rounded text-[10px] font-mono bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400">#support-zone</span>
                                </div>
                            </div>

                            {/* Data Grid */}
                            <div class="grid grid-cols-2 gap-3">
                                {/* LTP Card */}
                                <div class="bg-card-light dark:bg-card-dark p-5 rounded-lg border border-slate-100 dark:border-slate-800 shadow-sm hover:border-slate-300 dark:hover:border-slate-600 transition-colors group">
                                    <p class="text-xs font-medium text-slate-500 dark:text-text-secondary-dark mb-2 uppercase tracking-wide group-hover:text-primary transition-colors">Last Price</p>
                                    <p class="font-mono text-2xl font-bold text-slate-900 dark:text-white">Rs 742<span class="text-slate-400 dark:text-slate-600 text-lg">.00</span></p>
                                </div>
                                {/* Change Card */}
                                <div class="bg-card-light dark:bg-card-dark p-5 rounded-lg border border-slate-100 dark:border-slate-800 shadow-sm hover:border-slate-300 dark:hover:border-slate-600 transition-colors group">
                                    <p class="text-xs font-medium text-slate-500 dark:text-text-secondary-dark mb-2 uppercase tracking-wide group-hover:text-financial-green transition-colors">Change</p>
                                    <div class="flex items-baseline gap-2">
                                        <span class="material-symbols-outlined text-financial-green text-lg">trending_up</span>
                                        <p class="font-mono text-2xl font-bold text-financial-green">+1.2%</p>
                                    </div>
                                </div>
                                {/* Volume Card */}
                                <div class="bg-card-light dark:bg-card-dark p-5 rounded-lg border border-slate-100 dark:border-slate-800 shadow-sm hover:border-slate-300 dark:hover:border-slate-600 transition-colors group">
                                    <p class="text-xs font-medium text-slate-500 dark:text-text-secondary-dark mb-2 uppercase tracking-wide group-hover:text-primary transition-colors">Event Volume</p>
                                    <p class="font-mono text-xl font-bold text-slate-900 dark:text-white">12,405</p>
                                </div>
                                {/* Time Card */}
                                <div class="bg-card-light dark:bg-card-dark p-5 rounded-lg border border-slate-100 dark:border-slate-800 shadow-sm hover:border-slate-300 dark:hover:border-slate-600 transition-colors group">
                                    <p class="text-xs font-medium text-slate-500 dark:text-text-secondary-dark mb-2 uppercase tracking-wide group-hover:text-primary transition-colors">Timestamp</p>
                                    <p class="font-mono text-xl font-bold text-slate-900 dark:text-white">11:42:05</p>
                                </div>
                            </div>

                            {/* Technical Context */}
                            <div class="bg-card-light dark:bg-card-dark rounded-xl overflow-hidden border border-slate-100 dark:border-slate-800 shadow-sm">
                                <div class="p-4 border-b border-slate-100 dark:border-slate-800">
                                    <h3 class="text-xs font-bold uppercase tracking-widest text-slate-400 dark:text-slate-500">Market Depth Snapshot</h3>
                                </div>
                                <div class="grid grid-cols-2 text-xs font-mono">
                                    <div class="p-3 border-r border-b border-slate-100 dark:border-slate-800">
                                        <div class="flex justify-between mb-1">
                                            <span class="text-slate-500">Buy Qty</span>
                                            <span class="text-slate-900 dark:text-white">Price</span>
                                        </div>
                                        <div class="flex justify-between text-financial-green">
                                            <span>450</span>
                                            <span>741.00</span>
                                        </div>
                                        <div class="flex justify-between text-financial-green/70">
                                            <span>1200</span>
                                            <span>740.00</span>
                                        </div>
                                    </div>
                                    <div class="p-3 border-b border-slate-100 dark:border-slate-800">
                                        <div class="flex justify-between mb-1">
                                            <span class="text-slate-900 dark:text-white">Price</span>
                                            <span class="text-slate-500">Sell Qty</span>
                                        </div>
                                        <div class="flex justify-between text-financial-red">
                                            <span>743.00</span>
                                            <span>200</span>
                                        </div>
                                        <div class="flex justify-between text-financial-red/70">
                                            <span>744.00</span>
                                            <span>850</span>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </main>
                    <SignalFooter />
                </div>
            );
        };

        const App = () => {
            return (
                <MemoryRouter>
                    <Routes>
                        <Route path="/" element={<HomePage />} />
                        <Route path="/signal" element={<SignalPage />} />
                    </Routes>
                </MemoryRouter>
            );
        };

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
